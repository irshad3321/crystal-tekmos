services:
  mongo:
    image: mongo:8.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ADMIN_PASSWORD:?Set a MongoDB administrator password}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?Set a separate hex application password}
    volumes:
      - mongo_data:/data/db
      - ./deploy/init-mongo.js:/docker-entrypoint-initdb.d/10-app.js:ro
    networks: [database]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--host", "mongo", "--eval", "quit(db.adminCommand({ping:1}).ok ? 0 : 1)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    logging:
      driver: local

  api:
    build: .
    environment:
      PORT: "5000"
      NODE_ENV: production
      MONGO_URI: mongodb://crystal_app:${MONGO_APP_PASSWORD:?Set a separate hex application password}@mongo:27017/crystal_bullion
      GOLD_API_KEY: ${GOLD_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GOLD_API_BASE_URL: ${GOLD_API_BASE_URL:-}
      GROQ_MODEL: ${GROQ_MODEL:-}
      AI_PROVIDER: ${AI_PROVIDER:-groq}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-25000}
    networks: [default, database]
    depends_on:
      mongo:
        condition: service_healthy
    init: true
    restart: unless-stopped
    logging:
      driver: local

  proxy:
    image: caddy:2-alpine
    command: ["caddy", "reverse-proxy", "--from", "${API_DOMAIN:?Set API_DOMAIN in server/.env}", "--to", "api:5000"]
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    logging:
      driver: local

volumes:
  mongo_data:
  caddy_data:
  caddy_config:

networks:
  database:
    internal: true
